<body>
<div id="app"></div>
<div id="toast" class="toast" hidden></div>
<script>
window.APP_VERSION = '__VER__';
/* PWA: регистрируем service worker только по http(s); при смене контроллера
   (новая версия вступила в силу) перезагружаем страницу один раз.
   При самом первом визите контроллера ещё нет — не перезагружаем. */
(function () {
  if (!('serviceWorker' in navigator) || location.protocol.indexOf('http') !== 0) return;
  window.addEventListener('load', function () {
    var hadController = !!navigator.serviceWorker.controller;
    var refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (!hadController || refreshing) return;
      refreshing = true;
      location.reload();
    });
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
})();
</script>
<script>
/*__JS__*/
</script>
